    <text x="760" y="50" fill="#fb7185" font-family="ui-monospace,monospace" font-size="14">planner ω = 0.00</text><text x="760" y="76" fill="#4ade80" font-family="ui-monospace,monospace" font-size="14">applied ω = -0.60 rad/s</text>
