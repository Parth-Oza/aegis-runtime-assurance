<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Aegis runtime assurance evidence preview</title>
  <desc id="desc">An unsafe warehouse crossing command is replaced by a safe steering command, reducing modeled collision risk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#0c1c31"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="1"><stop stop-color="#142238"/><stop offset="1" stop-color="#0c1625"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="56" y="55" fill="#67e8f9" font-family="ui-monospace,monospace" font-size="18" letter-spacing="3">AEGIS / RUNTIME ASSURANCE EVIDENCE</text>
