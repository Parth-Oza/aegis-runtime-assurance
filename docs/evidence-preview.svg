  <g transform="translate(324 177)"><rect width="250" height="128" rx="16" fill="url(#panel)" stroke="#24344d"/><text x="22" y="35" fill="#91a4bd" font-family="ui-monospace,monospace" font-size="15">COMMANDED RISK</text><text x="22" y="88" fill="#fb7185" font-family="system-ui,sans-serif" font-size="40" font-weight="800">99.526%</text></g>
  <g transform="translate(592 177)"><rect width="250" height="128" rx="16" fill="url(#panel)" stroke="#24344d"/><text x="22" y="35" fill="#91a4bd" font-family="ui-monospace,monospace" font-size="15">APPLIED RISK</text><text x="22" y="88" fill="#4ade80" font-family="system-ui,sans-serif" font-size="40" font-weight="800">0.000311%</text></g>
  <g transform="translate(860 177)"><rect width="284" height="128" rx="16" fill="url(#panel)" stroke="#24344d"/><text x="22" y="35" fill="#91a4bd" font-family="ui-monospace,monospace" font-size="15">P95 / 26 CONTROLS</text><text x="22" y="88" fill="#eaf2ff" font-family="system-ui,sans-serif" font-size="40" font-weight="800">6.75 ms</text></g>
