    <text x="24" y="36" fill="#91a4bd" font-family="ui-monospace,monospace" font-size="15">COUNTERFACTUAL CONTROL SEARCH</text>
    <line x1="90" y1="168" x2="990" y2="168" stroke="#31445f" stroke-width="2"/>
    <path d="M90 168 C250 166 330 150 430 76 C520 18 598 40 700 132 C790 202 890 171 990 168" fill="none" stroke="#fb7185" stroke-width="5" filter="url(#glow)"/>
    <path d="M90 168 C260 169 335 159 430 137 C530 115 630 127 730 150 C820 171 900 169 990 168" fill="none" stroke="#4ade80" stroke-width="5" filter="url(#glow)"/>
